name: macOS

on:
  push:
    branches: [ main, refactor/generic_data ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches: [ main, refactor/generic_data ]

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    env:
      COMMON_CMAKE_FLAGS: >-
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -DCMAKE_BUILD_TYPE=Release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS with Apple Clang
          - name: "macOS Clang"
            compiler: clang
            cmake-generator: 'Ninja'
            cmake-options: ''

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ccache-${{ runner.os }}-${{ matrix.compiler }}-${{
          hashFiles('cmake/testcoe.cmake', 'cmake/cryptopp.cmake', 'cmake/json.cmake', 'tests/CMakeLists.txt') }}
        restore-keys: ccache-${{ runner.os }}-${{ matrix.compiler }}-

    - name: Configure CMake
      run: |
        cmake -B build -G "${{ matrix.cmake-generator }}" ${{ env.COMMON_CMAKE_FLAGS }} ${{ matrix.cmake-options }} -DDATACOE_BUILD_TESTS=ON

    - name: Build
      run: |
        cmake --build build --config Release --parallel

    - name: Run tests
      working-directory: build
      run: |
        ./tests/all_tests
      shell: bash